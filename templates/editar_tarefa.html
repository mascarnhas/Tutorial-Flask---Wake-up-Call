{% extends 'base.html' %}
{% block title %}Editar Tarefa - Task Manager{% endblock %}
{% block content %}

<h1 class="h3 mb-4">Editar tarefa</h1>

<div class="card shadow-sm">
    <div class="card-header fw-semibold">Tarefa #{{ tarefa.id }}</div>
    <div class="card-body">
        <form method="POST" action="/tarefas/{{ tarefa.id }}/editar">
            {% include '_form_tarefa.html' %}
            <div class="form-text mt-3"><span class="text-danger">*</span> Campo obrigatório</div>
            <div class="mt-3 d-flex justify-content-end gap-2">
                <a href="/tarefas" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Salvar alterações</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
