{% extends 'base.html' %}
{% block title %}Gerenciar Tarefas - Task Manager{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Tarefas</h1>
<div class="card shadow-sm mb-4">
    <div class="card-header fw-semibold">Nova tarefa</div>
    <div class="card-body">
        <form method="POST" action="/tarefas">
            {% include '_form_tarefa.html' %}
            <div class="form-text mt-3"><span class="text-danger">*</span> Campo obrigatório</div>
            <div class="mt-3 text-end">
                <button type="submit" class="btn btn-success">Salvar Tarefa</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
